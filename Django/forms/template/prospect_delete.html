<!-- templates/prospect_delete.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Prospect</title>
</head>
<body>
    <h1>Delete Prospect</h1>
    <p>Are you sure you want to delete {{ prospect.name_of_prospect }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Delete</button>
    </form>
    <a href="{% url 'prospect_list' %}">Cancel</a>
</body>
</html>
